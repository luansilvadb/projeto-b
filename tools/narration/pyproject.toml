[project]
name = "narration-tools"
version = "0.1.0"
description = "Geração (OmniVoice) e transcrição (Whisper) da narração"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Abaixo da 2.13.0 o torch tem falhas de corrupção de memória (GHSA-rrmf-rvhw-rf47).
    "torch==2.14.1",
    # O torchaudio parou na 2.11.0 (modo de manutenção) e não acompanha mais a versão do torch.
    "torchaudio==2.11.0",
    # Os pesos do OmniVoice são CC-BY-NC: uso não comercial.
    "omnivoice==0.2.1",
    "numpy",
    # Antes da 0.11 o librosa importava pkg_resources, que saiu do setuptools.
    "librosa>=0.11",
    "soundfile",
    "faster-whisper==1.2.1",
    # Praat: mede a altura da voz e amplia a entonação da amostra por PSOLA (pitch.py).
    "praat-parselmouth==0.4.7",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

# O índice cu128 parou no torch 2.11.0. O cu126 segue recebendo versões e continua no
# CUDA 12, de que o Whisper precisa: ele usa o cuBLAS e o cuDNN do torch (stt.py).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
